version: 0.2
# Builds the monorepo image (local-stack/docker/Dockerfile) and pushes to ECR.
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ECR_URI%%/*}
  build:
    commands:
      - docker build -f local-stack/docker/Dockerfile -t $ECR_URI:latest .
  post_build:
    commands:
      - docker push $ECR_URI:latest
